<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="quantumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="50%" stop-color="#08101a" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>
    <linearGradient id="cyanAmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ffb800" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.15)" />
      <stop offset="50%" stop-color="rgba(255, 184, 0, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 51, 102, 0.85)" />
    </linearGradient>
    <pattern id="qGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0, 240, 255, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#quantumBg)" />
  <rect width="800" height="450" fill="url(#qGrid)" />

  <!-- Title HUD Bar -->
  <rect x="25" y="20" width="750" height="36" fill="rgba(0, 240, 255, 0.06)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
  <circle cx="45" cy="38" r="4.5" fill="#00f0ff" />
  <text x="62" y="43" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#00f0ff" letter-spacing="2">QUANTUM ALPHA // 4D MARKET TOPOLOGY ENGINE</text>
  <text x="600" y="43" font-family="'Space Mono', monospace" font-size="11" fill="#ffb800">120 FPS // PyVista VTK GPU</text>

  <!-- Left: 4D Energy Topology 3D Wireframe Mesh -->
  <g transform="translate(30, 75)">
    <rect width="450" height="345" fill="rgba(5, 12, 22, 0.75)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" />
    
    <!-- Coordinate axes header -->
    <text x="20" y="30" font-family="'Space Mono', monospace" font-size="10" fill="#00f0ff">ENERGY SURFACE FIELD: E(t, a) // 3,400+ TRADING DAYS</text>
    <text x="320" y="30" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.6)">[BTC/ETH/SPY/GLD]</text>

    <!-- 3D Perspective Isometric Wireframe Splines -->
    <g transform="translate(40, 60)">
      <!-- Spline curve 1 (Base horizon) -->
      <path d="M 0 180 Q 90 120 180 150 T 360 110" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
      <path d="M 0 150 Q 80 80 170 120 T 360 80" fill="none" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5" />
      <path d="M 0 120 Q 100 40 190 90 T 360 50" fill="none" stroke="rgba(255, 184, 0, 0.7)" stroke-width="2" />
      <path d="M 0 90 Q 110 10 200 60 T 360 20" fill="none" stroke="#ff3366" stroke-width="2.5" />
      
      <!-- Cross grid ribs -->
      <line x1="0" y1="180" x2="0" y2="90" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="90" y1="120" x2="110" y2="10" stroke="rgba(255, 184, 0, 0.4)" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="180" y1="150" x2="200" y2="60" stroke="rgba(255, 184, 0, 0.4)" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="270" y1="130" x2="280" y2="35" stroke="rgba(255, 51, 102, 0.4)" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="360" y1="110" x2="360" y2="20" stroke="rgba(255, 51, 102, 0.4)" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Peak singularity node -->
      <circle cx="110" cy="10" r="5" fill="#ff3366" />
      <circle cx="110" cy="10" r="12" fill="none" stroke="#ff3366" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="125" y="14" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#ff3366">MAX VOLATILITY REGIME (α = 4.82)</text>

      <!-- Local minimum node -->
      <circle cx="200" cy="60" r="4" fill="#00f0ff" />
      <text x="215" y="64" font-family="'Space Mono', monospace" font-size="9" fill="#00f0ff">MEAN REVERSION BASIN</text>
    </g>

    <!-- Live Telemetry Stream Strip -->
    <rect x="20" y="275" width="410" height="48" fill="rgba(0,0,0,0.5)" stroke="rgba(0, 240, 255, 0.2)" />
    <text x="32" y="295" font-family="'Space Mono', monospace" font-size="9.5" fill="#00f0ff">► VTK SPLINE: 90x90 MESH</text>
    <text x="210" y="295" font-family="'Space Mono', monospace" font-size="9.5" fill="#ffb800">TENSOR: 3,400 x 4 x 6</text>
    <text x="32" y="312" font-family="'Space Mono', monospace" font-size="9.5" fill="#ffffff">► PARALLEL GPU NVENC</text>
    <text x="210" y="312" font-family="'Space Mono', monospace" font-size="9.5" fill="#50fa7b">FRAME TIME: 8.33ms (120 FPS)</text>
  </g>

  <!-- Right: Metrics & Architecture Feed -->
  <g transform="translate(500, 75)">
    <rect width="275" height="345" fill="rgba(5, 12, 22, 0.75)" stroke="rgba(255, 184, 0, 0.3)" stroke-width="1" />
    <text x="20" y="28" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#ffb800">ENGINE SPECIFICATIONS</text>

    <!-- Metric Card 1 -->
    <rect x="18" y="42" width="238" height="60" fill="rgba(255, 184, 0, 0.05)" stroke="rgba(255, 184, 0, 0.2)" />
    <text x="30" y="64" font-family="'Orbitron', sans-serif" font-size="20" font-weight="800" fill="#ffb800">120 FPS</text>
    <text x="30" y="86" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">PyVista Hardware Compositor</text>

    <!-- Metric Card 2 -->
    <rect x="18" y="112" width="238" height="60" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.2)" />
    <text x="30" y="134" font-family="'Orbitron', sans-serif" font-size="20" font-weight="800" fill="#00f0ff">3,400+</text>
    <text x="30" y="156" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Trading Days Multi-Asset Data</text>

    <!-- Metric Card 3 -->
    <rect x="18" y="182" width="238" height="60" fill="rgba(255, 51, 102, 0.05)" stroke="rgba(255, 51, 102, 0.2)" />
    <text x="30" y="204" font-family="'Orbitron', sans-serif" font-size="20" font-weight="800" fill="#ff3366">&lt; 0.9s</text>
    <text x="30" y="226" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Render Time (vs 10hr CPU)</text>

    <!-- Pipeline Badges -->
    <rect x="18" y="254" width="238" height="74" fill="rgba(0,0,0,0.6)" stroke="rgba(0, 240, 255, 0.15)" />
    <text x="30" y="274" font-family="'Space Mono', monospace" font-size="9" fill="#00f0ff">CORE STACK:</text>
    <text x="30" y="292" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Python 3.11 • PyVista • VTK</text>
    <text x="30" y="312" font-family="'Space Mono', monospace" font-size="9" fill="#ffb800">NumPy • SciPy • FFmpeg NVENC</text>
  </g>
</svg>
