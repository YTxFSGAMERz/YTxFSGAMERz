    <polygon points="0,25 -6,15 6,15" fill="#aaff00" />
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#000000" stroke="#aaff00" stroke-width="1" />
    <text x="0" y="4" font-family="'Space Mono', monospace" font-size="9" fill="#aaff00" text-anchor="middle">eBPF PROBE HOOK</text>
