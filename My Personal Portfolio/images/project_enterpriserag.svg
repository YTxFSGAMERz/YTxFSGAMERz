    <text x="55" y="0" font-family="'Space Mono', monospace" font-size="10" fill="#ffffff">Token Entropy: 0.81 (Legitimate query)</text>
    <text x="310" y="0" font-family="'Space Mono', monospace" font-size="9" fill="#00f3ff">LOGGED</text>
  </g>

  <g transform="translate(425, 260)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="10" fill="#ff0055">[BLOCKED]</text>
    <text x="65" y="0" font-family="'Space Mono', monospace" font-size="10" fill="#ff5555">Exfiltration Attempt: port 4444 scan</text>
