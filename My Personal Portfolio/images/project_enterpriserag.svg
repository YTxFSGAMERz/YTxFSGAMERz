  <text x="440" y="325" font-family="'Space Mono', monospace" font-size="11" fill="#ec4899">THREAT MITIGATION: 99.9%</text>
  <text x="645" y="325" font-family="'Space Mono', monospace" font-size="11" fill="#aaff00">RING-0 OK</text>

