    <circle r="55" fill="none" stroke="#aaff00" stroke-width="10" stroke-dasharray="90 345" stroke-dashoffset="-240" stroke-linecap="round" />
    <text x="0" y="6" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">A-</text>
    <text x="0" y="24" font-family="'Space Mono', monospace" font-size="9" fill="#00ff66" text-anchor="middle">HARDENED</text>
  </g>

  <!-- Metrics column -->
  <text x="200" y="145" font-family="'Space Mono', monospace" font-size="11" fill="#8892b0">OPEN PORTS: <tspan fill="#ffffff" font-weight="700">4 / 65535</tspan></text>
  <text x="200" y="175" font-family="'Space Mono', monospace" font-size="11" fill="#8892b0">CVEs DETECTED: <tspan fill="#ff0055" font-weight="700">1 CRIT, 2 MED</tspan></text>
  <text x="200" y="205" font-family="'Space Mono', monospace" font-size="11" fill="#8892b0">SCAN VELOCITY: <tspan fill="#aaff00" font-weight="700">12,400 p/sec</tspan></text>
  <text x="200" y="235" font-family="'Space Mono', monospace" font-size="11" fill="#8892b0">ORCHESTRATION: <tspan fill="#00f3ff" font-weight="700">FastAPI Async</tspan></text>

